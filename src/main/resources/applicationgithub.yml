spring:
  datasource:
    url:
    username:
    password:
    driver:
      class-name:
  jpa:
    database-platform:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2MB
      max-file-size: 200MB
      max-request-size: 210MB
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
server:
  error:
    include-stacktrace: never
file:
  upload-dir: C:/OSS/Projetos/UploadDir  #Diretorio para salvar os arquivos